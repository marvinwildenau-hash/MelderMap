# Baut MelderMap als Windows-Programm (Installer) und legt es unter Releases ab.
# Start: scripts/release-desktop.sh oder von Hand unter Actions → Windows-App → Run workflow.
name: Windows-App
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: App-Datei bereitstellen
        id: v
        shell: bash
        run: |
          mkdir -p desktop/dist && cp docs/index.html desktop/dist/index.html
          echo "tag=v$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      - name: Programm bauen
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          set -o pipefail
          npx --yes @tauri-apps/cli@2 build 2>&1 | tee "$RUNNER_TEMP/build.log"
      # Bei einem Fehler das Bau-Protokoll in den Zweig build-log legen (die Protokolle von Actions sind nicht überall lesbar)
      - name: Fehlerprotokoll ablegen
        if: failure()
        shell: bash
        run: |
          tail -c 60000 "$RUNNER_TEMP/build.log" > "$RUNNER_TEMP/tail.log" || echo "kein Protokoll" > "$RUNNER_TEMP/tail.log"
          git config user.name "build" && git config user.email "build@users.noreply.github.com"
          git checkout --orphan build-log && git rm -rqf --cached . && cp "$RUNNER_TEMP/tail.log" build.log
          git add build.log && git commit -qm "Bau-Protokoll ${{ github.run_id }}" && git push -f origin build-log
      - name: Unter Releases ablegen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: MelderMap ${{ steps.v.outputs.tag }} für Windows
          make_latest: true
          body: |
            Installer für Windows 10 und 11. Herunterladen, doppelklicken, fertig.
            Beim ersten Start zeigt Windows eventuell „Der Computer wurde durch Windows geschützt“: „Weitere Informationen“ und dann „Trotzdem ausführen“ wählen.
          files: desktop/src-tauri/target/release/bundle/nsis/*.exe
