[package]
name = "meldermap"
version = "1.15.2"
description = "MelderMap by Wildenau"
authors = ["Marvin Wildenau"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde_json = "1"

[profile.release]
strip = true
lto = true
opt-level = "s"
codegen-units = 1
